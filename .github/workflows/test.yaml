name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly canary: catches golangci-lint releases or ecosystem drift breaking the
    # shared-dependency-graph contract between this plugin and golangci-lint
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  plugin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build a custom golangci-lint with this plugin
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          cat > .custom-gcl.yml <<EOF
          version: v2.12.2
          plugins:
            - module: "github.com/katbyte/deadcode-golangci"
              import: "github.com/katbyte/deadcode-golangci/plugin"
              path: .
          EOF
          "$(go env GOPATH)/bin/golangci-lint" custom
      - name: Run the plugin against the test fixture
        run: |
          cp -r deadcode/testdata/fixture /tmp/fixture
          cat > /tmp/fixture/.golangci.yml <<EOF
          version: "2"
          linters:
            default: none
            enable: [deadcode]
            settings:
              custom:
                deadcode: {type: module}
          EOF
          GCL="$PWD/custom-gcl"
          cd /tmp/fixture
          # expect exactly the 10 known-dead functions
          "$GCL" run ./... > report.txt || true
          grep -c 'unreachable func' report.txt | grep -qx 10
          # --fix must remove them all and leave a compiling program
          "$GCL" run --fix ./... || true
          go build ./...
